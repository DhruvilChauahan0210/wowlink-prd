# WowLink's Supabase Auth settings, kept in the repo. `supabase config push` sends only what this file declares to the
# linked project (everything else there stays as it is); `supabase config diff` shows the changes first.

project_id = "wowlink"

[auth]
# Where Google sends hosts back after signing in: the live site, and a local `npm run dev`.
site_url = "https://wowlink-one.vercel.app"
additional_redirect_urls = ["https://wowlink-one.vercel.app/**", "http://localhost:3000/**"]

# Hosts sign in with Google only (switched on in the dashboard, where its client secret is kept). No sign-in by email:
# nobody can make the project send sign-in emails.
[auth.email]
enable_signup = false
