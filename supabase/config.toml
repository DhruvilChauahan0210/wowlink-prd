# WowLink's Supabase Auth settings, kept in the repo. `supabase config push` sends only what this file declares to the
# linked project (everything else there stays as it is); `supabase config diff` shows the changes first.

project_id = "wowlink"

[auth]
# Where Google sends hosts back after signing in: the live site, and a local `npm run dev`.
site_url = "https://wowlink-one.vercel.app"
additional_redirect_urls = ["https://wowlink-one.vercel.app/**", "http://localhost:3000/**"]

# Hosts sign in with Google only. No sign-in by email: nobody can make the project send sign-in emails.
[auth.email]
enable_signup = false

# Google sign-in (Google Cloud project wowlink-512516). The client secret is never in this file: push with
# SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET set (README, "Going live"); without it the CLI leaves the secret as it is.
[auth.external.google]
enabled = true
client_id = "397415263269-7he9pg82tkk0pd2v248agdkjk74cst0s.apps.googleusercontent.com"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false
