name: Tests

# Every push to main is deployed to the live site from here (Vercel's own deploys of main are off, vercel.json).
# The tests (the whole Playwright suite on the JSON file and on Postgres, about 6 minutes) run first and must pass
# only when the repository variable TESTS_BEFORE_DEPLOY is "true". It's off while WowLink is being built quickly;
# turn it on before many people use it.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push makes an older run of the same branch pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: vars.TESTS_BEFORE_DEPLOY == 'true'
    # Pinned rather than ubuntu-latest, so a runner image change can't break Playwright's system dependencies.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run lint

      - name: Run the tests
        run: npm test

      - name: Run the tests on Postgres
        run: npm run test:pg

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    # With the tests on, only what passed goes live; with them off, every push does. Needs the VERCEL_TOKEN secret
    # (README, "Going live"); the ids aren't secret. A new database migration is applied before pushing it
    # (npm run db:migrate), so the new code finds its tables.
    needs: test
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_MZ8qck5QQF2GT61SCmtdnIjx
      VERCEL_PROJECT_ID: prj_lNOU6CneK8zx38vF5LivX3k22Vi5
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # The site's own address, built into canonical links, the sitemap, robots.txt and share images. Without it the
      # build falls back to localhost. Change it here when WowLink moves to its own domain.
      NEXT_PUBLIC_SITE_URL: https://wowlink-one.vercel.app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: The Vercel token is set
        run: test -n "$VERCEL_TOKEN" || { echo "::error::Add the VERCEL_TOKEN secret to the repository (README, Going live)."; exit 1; }

      - name: Build for production
        run: |
          npx -y vercel@65.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx -y vercel@65.2.0 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: npx -y vercel@65.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: The live site answers
        run: bash scripts/live-check.sh "$NEXT_PUBLIC_SITE_URL"
